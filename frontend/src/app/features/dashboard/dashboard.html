<section class="dashboard">
  <header class="dashboard__topo">
    <h1 class="dashboard__titulo">Dashboard</h1>

    <label class="dashboard__busca">
      <svg class="dashboard__busca-icone" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
        />
      </svg>
      <input
        class="dashboard__busca-campo"
        type="search"
        placeholder="Pesquisar solicitações"
        aria-label="Pesquisar solicitações"
        [value]="busca()"
        (input)="aoDigitar($event)"
      />
    </label>
  </header>

  <div class="dashboard__grelha">
    @for (cartao of cartoes; track cartao) {
      <app-card class="dashboard__cartao" />
    }
  </div>
</section>
