<nav class="navbar" aria-label="Navegação principal">
  <ul class="navbar__list">
    @for (item of itensVisiveis(); track item.route) {
      <li class="navbar__item" [class.navbar__item--grupo]="item.novoGrupo && ehAdmin()">
        <a
          class="navbar__link"
          [routerLink]="item.route"
          routerLinkActive="navbar__link--active"
          [attr.aria-label]="item.label"
          [title]="item.label"
        >
          <i class="navbar__icon" [class]="item.icon" aria-hidden="true"></i>
          <span class="navbar__label">{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>

  <!-- Botão Sair, fixo no rodapé da barra -->
  <button type="button" class="navbar__sair" (click)="sair()" aria-label="Sair" title="Sair">
    <i class="navbar__icon fa-solid fa-right-from-bracket" aria-hidden="true"></i>
    <span class="navbar__label">Sair</span>
  </button>
</nav>
