<!-- Botão nativo. As propriedades vêm dos inputs da classe (ex.: type() lê o valor atual).
     Cada [class.x] adiciona a classe CSS "x" só quando a condição é verdadeira. -->
<button
  [type]="type()"
  [disabled]="disabled()"
  class="btn"
  [class.btn--primary]="variant() === 'primary'"
  [class.btn--secondary]="variant() === 'secondary'"
  [class.btn--full]="fullWidth()"
>
  <!-- Projeta aqui o texto escrito entre <app-button>...</app-button> -->
  <ng-content />
</button>
