@if (ativo) {
  <div class="demo">
    @if (aberto()) {
      <div class="demo__painel" role="dialog" aria-labelledby="demo-titulo">
        <p id="demo-titulo" class="demo__titulo">Demonstração</p>
        <p class="demo__dica">Entrar como (sem senha):</p>
        <ul class="demo__contas">
          @for (u of contas(); track u.id) {
            <li>
              <button type="button" class="demo__conta" [attr.aria-current]="u.id === eu().id ? 'true' : null"
                (click)="entrarComo(u.id, u.nome)">
                <span class="demo__nome">{{ u.nome }}</span>
                <span class="demo__perfil">{{ u.perfil === 'admin' ? 'Coordenação' : 'Professor' }}{{ u.id === eu().id ? ' · você' : '' }}</span>
              </button>
            </li>
          }
        </ul>
        <button type="button" class="demo__restaurar" (click)="restaurar()">
          <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Restaurar dados iniciais
        </button>
        <p class="demo__atalho">Atalho: Ctrl + Alt + Shift + R</p>
      </div>
    }
    <button type="button" class="demo__botao" [attr.aria-expanded]="aberto()" (click)="aberto.set(!aberto())">
      <span class="demo__ponto" aria-hidden="true"></span>
      Demonstração · {{ eu().nome.split(' ')[0] }}
    </button>
  </div>
}
