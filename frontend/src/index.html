<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>FAB | Aprender, Organizar e Evoluir</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FAB: empréstimo de equipamentos e controle de insumos escolares, do pedido à devolução.">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icone-192.png">
  <script>
    /* Aplica o tema e a fonte escolhidos ANTES do app carregar: a tela não pisca em branco no modo escuro. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('fab_acessibilidade') || '{}');
        var escuro = p.tema === 'escuro' || (p.tema === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (escuro) document.documentElement.classList.add('tema-escuro');
        if (p.fonteLegivel) document.documentElement.classList.add('a11y-fonte-legivel');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
