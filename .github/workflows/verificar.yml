name: Verificar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Executar testes unitários
        run: npm test

      - name: Executar testes de integração
        run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar
        run: npm run build

  postgres:
    name: Ciclos no PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      banco:
        image: postgres:16
        env:
          POSTGRES_USER: fab
          POSTGRES_PASSWORD: fab_e5_ci
          POSTGRES_DB: fab_e5_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fab -d fab_e5_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E5_DATABASE_URL: postgresql://fab:fab_e5_ci@localhost:5432/fab_e5_test
      NODE_ENV: test
      APP_TIMEZONE: America/Belem
      JWT_SECRET: segredo-exclusivo-ci-e5-com-mais-de-32-caracteres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Reset e testes com PostgreSQL real
        run: npm run test:e2e:postgres
